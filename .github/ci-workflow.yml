# CI workflow, staged outside .github/workflows/ because the agent that wrote
# it cannot push workflow files (its token lacks the `workflow` scope).
#
# To activate:
#
#     mkdir -p .github/workflows
#     git mv .github/ci-workflow.yml .github/workflows/ci.yml
#     git commit -m "ci: run typecheck, tests and the build on every PR"
#
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push supersedes the run already in flight for the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      # The suite shells out to real git (in temp dirs) and to a fake `gh` on
      # PATH; no GitHub token is involved. tmux is preinstalled on the runner
      # for the terminal tests to come.
      - name: Test
        run: bun test --timeout 30000

      - name: Build the standalone binary
        run: bun run build
